# TLS: شهادة Let's Encrypt واحدة تغطي الدومينات الخمسة، مُجدَّدة عبر certbot
# (الحجم مركّب على الوسيط من /opt/tanfeeth/nginx/letsencrypt). الشهادة
# الموقّعة ذاتيًا في /etc/nginx/certs كانت للإقلاع الأول فقط قبل إصدار
# الشهادة — الإشارة إليها هنا تُقدِّم شهادة غير موثوقة لكل زائر.

# Docker's embedded DNS — lets proxy_pass resolve container names at request
# time, so nginx starts even if an upstream app container is down.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# Reject unknown hosts.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     /etc/letsencrypt/live/tanfeeth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanfeeth.io/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name _;
    return 444;
}

# --- Production API ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/tanfeeth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanfeeth.io/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name api.tanfeeth.io;
    client_max_body_size 30m;   # ≥ the API's 25MB contract-document limit (default 1m → 413)

    # حزمة ملفات المتنافس: ملفٌ واحد من عرضٍ حقيقي بلغ ١٦٠ ميغابايت، والحدّ
    # العام (30m) كان يردّها 413 قبل أن تصل إلى الخادم. الحدّ موسَّع هنا وحده
    # لا في كل مسار — بابٌ مفتوح على كل المسارات سطحُ إغراقٍ لا لزوم له.
    location ~ ^/api/competitions/[0-9a-fA-F-]+/offers/[0-9a-fA-F-]+/files$ {
        set $upstream http://tanfeeth-api-prod:3000;
        proxy_pass $upstream;
        client_max_body_size 400m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # مسارات القراءة الآلية للعروض: تقرأ عشرات المستندات بصريًا، وقياسٌ على
    # كراسة حقيقية أعطى ٨٥ ثانية لاشتقاق الأسئلة وحده — و120s تقطعها بـ504
    # بينما القراءة ما زالت تعمل وتُحتسب.
    location ~ ^/api/competitions/[0-9a-fA-F-]+/(offer-questionnaire/generate|offers/(generate-test|[0-9a-fA-F-]+/(read-files|summary)))$ {
        set $upstream http://tanfeeth-api-prod:3000;
        proxy_pass $upstream;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # قراءة عقد موقّع بنموذج استدلالي: مستند كامل بجهد عالٍ يتجاوز الـ120 ثانية
    # على العقود الطويلة. المهلة هنا أعلى من مهلة الخادم (300s) فينتهي الطلب
    # برسالة الخادم لا بـ504 من nginx بينما التحليل ما زال يعمل ويُحتسب.
    location = /api/contracts/from-document/analyze {
        set $upstream http://tanfeeth-api-prod:3000;
        proxy_pass $upstream;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # مركز التدريب: سكربت المدرّب ثم صوته (نموذج + تحويل نص إلى كلام) قد يتجاوزان
    # الـ120 ثانية للمقطع الطويل، والتسخين يولّد عشرات المقاطع في الخلفية،
    # و«اسأل المدرّب» بثٌّ حيّ. مهلة أطول هنا وحدها.
    location ~ ^/api/training/(narrate|ask|warm)$ {
        set $upstream http://tanfeeth-api-prod:3000;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / {
        set $upstream http://tanfeeth-api-prod:3000;
        proxy_pass $upstream;
        proxy_read_timeout 120s; # headroom for AI-backed endpoints (default 60s → 504)
    }
}

# --- Production web (apex + www) ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/tanfeeth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanfeeth.io/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name tanfeeth.io www.tanfeeth.io;
    location / {
        set $upstream http://tanfeeth-web-prod:3000;
        proxy_pass $upstream;
    }
}

