# TLS: شهادة Let's Encrypt واحدة تغطي الدومينات الخمسة، مُجدَّدة عبر certbot
# (الحجم مركّب على الوسيط من /opt/tanfeeth/nginx/letsencrypt). الشهادة
# الموقّعة ذاتيًا في /etc/nginx/certs كانت للإقلاع الأول فقط قبل إصدار
# الشهادة — الإشارة إليها هنا تُقدِّم شهادة غير موثوقة لكل زائر.

# Docker's embedded DNS — lets proxy_pass resolve container names at request
# time, so nginx starts even if an upstream app container is down.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# Reject unknown hosts.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     /etc/letsencrypt/live/tanfeeth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanfeeth.io/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name _;
    return 444;
}

# --- Production API ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/tanfeeth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanfeeth.io/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name api.tanfeeth.io;
    client_max_body_size 30m;   # ≥ the API's 25MB contract-document limit (default 1m → 413)

    # قراءة عقد موقّع بنموذج استدلالي: مستند كامل بجهد عالٍ يتجاوز الـ120 ثانية
    # على العقود الطويلة. المهلة هنا أعلى من مهلة الخادم (300s) فينتهي الطلب
    # برسالة الخادم لا بـ504 من nginx بينما التحليل ما زال يعمل ويُحتسب.
    location = /api/contracts/from-document/analyze {
        set $upstream http://tanfeeth-api-prod:3000;
        proxy_pass $upstream;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / {
        set $upstream http://tanfeeth-api-prod:3000;
        proxy_pass $upstream;
        proxy_read_timeout 120s; # headroom for AI-backed endpoints (default 60s → 504)
    }
}

# --- Production web (apex + www) ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/tanfeeth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanfeeth.io/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name tanfeeth.io www.tanfeeth.io;
    location / {
        set $upstream http://tanfeeth-web-prod:3000;
        proxy_pass $upstream;
    }
}

# --- Staging API ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/tanfeeth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanfeeth.io/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name staging-api.tanfeeth.io;
    client_max_body_size 30m;   # ≥ the API's 25MB contract-document limit (default 1m → 413)

    # انظر تعليق الإنتاج: قراءة العقد من ملفه تتجاوز الـ120 ثانية.
    location = /api/contracts/from-document/analyze {
        set $upstream http://tanfeeth-api-staging:3000;
        proxy_pass $upstream;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / {
        set $upstream http://tanfeeth-api-staging:3000;
        proxy_pass $upstream;
        proxy_read_timeout 120s; # headroom for AI-backed endpoints (default 60s → 504)
    }
}

# --- Staging web ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/tanfeeth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanfeeth.io/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name staging.tanfeeth.io;
    location / {
        set $upstream http://tanfeeth-web-staging:3000;
        proxy_pass $upstream;
    }
}
