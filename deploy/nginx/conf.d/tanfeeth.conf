# Docker's embedded DNS — lets proxy_pass resolve container names at request
# time, so nginx starts even if an upstream app container is down.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# Reject unknown hosts.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     /etc/nginx/certs/tanfeeth.crt;
    ssl_certificate_key /etc/nginx/certs/tanfeeth.key;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name _;
    return 444;
}

# --- Production API ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/tanfeeth.crt;
    ssl_certificate_key /etc/nginx/certs/tanfeeth.key;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name api.tanfeeth.io;
    client_max_body_size 20m;   # match the API's 15MB upload limit (default 1m → 413)
    location / {
        set $upstream http://tanfeeth-api-prod:3000;
        proxy_pass $upstream;
        proxy_read_timeout 120s; # headroom for AI-backed endpoints (default 60s → 504)
    }
}

# --- Production web (apex + www) ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/tanfeeth.crt;
    ssl_certificate_key /etc/nginx/certs/tanfeeth.key;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    server_name tanfeeth.io www.tanfeeth.io;
    location / {
        set $upstream http://tanfeeth-web-prod:3000;
        proxy_pass $upstream;
    }
}

