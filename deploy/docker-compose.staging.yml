name: tanfeeth-staging

# Staging stack — canonical copy lives in this repo AND the meta repo's
# deploy/; the frontend-v2 CI syncs it to /opt/tanfeeth on deploy.
# web = frontend-v2 (the new Arabic-only app). The api also joins the shared
# staging RFP net to reach tanfeeth-rfp-staging.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tanfeeth-pg-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
    networks:
      - tanfeeth-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/kareem-3del/tanfeeth-api:staging
    container_name: tanfeeth-api-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tanfeeth-net
      - rfp-staging

  web:
    image: ghcr.io/kareem-3del/tanfeeth-frontend-v2:staging
    container_name: tanfeeth-web-staging
    restart: unless-stopped
    networks:
      - tanfeeth-net

networks:
  tanfeeth-net:
    external: true
  rfp-staging:
    name: tanfeeth-rfp-net-staging
    external: true

volumes:
  pgdata-staging:
